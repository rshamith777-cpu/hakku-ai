<style>
  :root {
    --ink: #111111;
    --paper: #F4EFE6;
    --paper-2: #EAE4D8;
    --paper-3: #FFFDF7;
    --verm: #FF3B30;
    --amber: #FF9500;
    --mut: #444748;
    --outline: #747878;
    --glass: rgba(255, 255, 255, 0.75);
    --spring: cubic-bezier(0.16, 1, 0.3, 1);
    --spring-snappy: cubic-bezier(0.22, 1.35, 0.32, 1);
  }
  html { -webkit-text-size-adjust: 100%; font-size: 16px; }
  body {
    background-color: var(--paper);
    background-image: radial-gradient(rgba(17,17,17,0.05) 1px, transparent 1.2px);
    background-size: 22px 22px;
    color: var(--ink);
    min-height: 100vh;
  }
  ::selection { background: var(--verm); color: #fff; }

  /* absolute sharpness — the only rounds allowed are printer glyphs & live dots */
  .rounded-xl, .rounded-lg, .rounded-2xl, .rounded-3xl, .rounded-md { border-radius: 0 !important; }

  /* ---- motion primitives ---- */
  @keyframes viewEnter { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes childPop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pulseDot { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.45; transform:scale(.75);} }
  @keyframes ringPulse { 0% { box-shadow: 0 0 0 0 rgba(255,59,48,.4);} 70% { box-shadow: 0 0 0 10px rgba(255,59,48,0);} 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0);} }
  .view-enter { animation: viewEnter .5s var(--spring) both; }
  .rise-in { animation: riseIn .55s var(--spring) both; }
  .pop-stagger > * { animation: childPop .5s var(--spring) both; }
  .pop-stagger > *:nth-child(1) { animation-delay: .04s } .pop-stagger > *:nth-child(2) { animation-delay: .10s }
  .pop-stagger > *:nth-child(3) { animation-delay: .16s } .pop-stagger > *:nth-child(4) { animation-delay: .22s }
  .pop-stagger > *:nth-child(5) { animation-delay: .28s } .pop-stagger > *:nth-child(6) { animation-delay: .34s }
  .pop-stagger > *:nth-child(7) { animation-delay: .40s } .pop-stagger > *:nth-child(8) { animation-delay: .46s }
  .pop-stagger > *:nth-child(n+9) { animation-delay: .54s }
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .65s var(--spring), transform .65s var(--spring); }
  .reveal.is-in { opacity: 1; transform: none; }
  .hover-spring { transition: transform .3s var(--spring-snappy), box-shadow .3s var(--spring); }
  .hover-spring:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--verm) !important; }
  .hover-spring:active { transform: translate(1px, 1px); box-shadow: 3px 3px 0 var(--verm) !important; }
  .live-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--verm); animation: pulseDot 1.4s ease-in-out infinite; }
  .speaking-pulse { animation: ringPulse 1.25s infinite; }

  /* ---- editorial cards & glass panes ---- */
  .sv-card { background: var(--glass); backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
  .glass-lead { background: rgba(255,255,255,0.72); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }

  .stamp { display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--ink); background:var(--paper); color:var(--ink); padding:.16rem .55rem; font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; box-shadow:2px 2px 0 var(--ink); }

  .mono-label { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--ink); }

  /* ---- forensic toggles (print-checkbox) ---- */

  /* ---- view 3 ---- */
